name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project TubeArchivistTV.xcodeproj \
            -scheme TubeArchivistTV \
            -destination "generic/platform=iOS" \
            -archivePath build/TubeTV.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.beyondtim.TubeTV
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/TubeTV.xcarchive/Products/Applications/TubeArchivistTV.app Payload/
          zip -r TubeTV.ipa Payload/
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TubeTV
          path: TubeTV.ipa
